<body class="back-cover"><h1>Back Cover Blurb</h1><p>A junk-tier tank with a death-clock in her blood. A hidden dungeon with no legal owner. A System that pays her to hold monsters in place until they kill the room itself.</p>
<p>Nadia Vess has the kind of class that should never work. Instead, it becomes the only thing keeping her alive.</p></body>
