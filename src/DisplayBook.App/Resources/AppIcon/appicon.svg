<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EA"/>
      <stop offset="100%" stop-color="#EDE1C4"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EA"/>
      <stop offset="100%" stop-color="#EDE1C4"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" fill="#14213D"/>

  <!-- back cover peeking behind pages -->
  <path d="M140,162 C190,144 228,153 256,172 C284,153 322,144 372,162 L372,190 C322,172 284,181 256,200 C228,181 190,172 140,190 Z" fill="#0D1626"/>

  <!-- left page -->
  <path d="M256,190 C202,160 148,154 96,162 L96,354 C148,346 202,352 256,382 Z" fill="url(#pageLeft)" stroke="#14213D" stroke-width="6" stroke-linejoin="round"/>

  <!-- right page -->
  <path d="M256,190 C310,160 364,154 416,162 L416,354 C364,346 310,352 256,382 Z" fill="url(#pageRight)" stroke="#14213D" stroke-width="6" stroke-linejoin="round"/>

  <!-- spine -->
  <path d="M256,190 L256,382" fill="none" stroke="#14213D" stroke-width="6" stroke-linecap="round"/>

  <!-- ribbon bookmark -->
  <path d="M234,160 L278,160 L278,326 L256,306 L234,326 Z" fill="#E8A94C"/>
</svg>
