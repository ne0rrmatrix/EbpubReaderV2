<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#E8A94C" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#E8A94C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E8A94C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EA"/>
      <stop offset="100%" stop-color="#EDE1C4"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EA"/>
      <stop offset="100%" stop-color="#EDE1C4"/>
    </linearGradient>
  </defs>

  <!-- lamplight glow -->
  <circle cx="256" cy="250" r="230" fill="url(#glow)"/>

  <!-- back cover peeking behind pages -->
  <path d="M150,158 C195,142 230,150 256,168 C282,150 317,142 362,158 L362,182 C317,166 282,174 256,192 C230,174 195,166 150,182 Z" fill="#101a30"/>

  <!-- left page -->
  <path d="M256,178 C206,150 156,145 108,152 L108,338 C156,331 206,336 256,364 Z" fill="url(#pageLeft)" stroke="#14213D" stroke-width="3" stroke-linejoin="round"/>

  <!-- right page -->
  <path d="M256,178 C306,150 356,145 404,152 L404,338 C356,331 306,336 256,364 Z" fill="url(#pageRight)" stroke="#14213D" stroke-width="3" stroke-linejoin="round"/>

  <!-- page lines, left -->
  <path d="M128,180 C165,172 198,175 232,192" fill="none" stroke="#C9BFA0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M128,210 C165,202 198,205 232,222" fill="none" stroke="#C9BFA0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M128,240 C165,232 198,235 232,252" fill="none" stroke="#C9BFA0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- page lines, right -->
  <path d="M384,180 C347,172 314,175 280,192" fill="none" stroke="#C9BFA0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M384,210 C347,202 314,205 280,222" fill="none" stroke="#C9BFA0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M384,240 C347,232 314,235 280,252" fill="none" stroke="#C9BFA0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- spine -->
  <path d="M256,178 L256,364" fill="none" stroke="#14213D" stroke-width="3" stroke-linecap="round"/>

  <!-- ribbon bookmark -->
  <path d="M238,150 L274,150 L274,300 L256,282 L238,300 Z" fill="#E8A94C"/>
</svg>
